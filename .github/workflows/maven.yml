name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Khuyên dùng phiên bản v4 thay vì v3
      - name: Set up JDK 21
        uses: actions/setup-java@v4 # Khuyên dùng phiên bản v4 để tránh cảnh báo deprecated
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml-B package --file pom.xml