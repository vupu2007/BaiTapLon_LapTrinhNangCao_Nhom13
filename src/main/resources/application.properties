server.port=8080

# --- CẤU HÌNH KẾT NỐI DATABASE ---
spring.datasource.url=jdbc:mysql://localhost:3306/auction_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# --- CẤU HÌNH HIKARI CONNECTION POOL (SỬA DỨT ĐIỂM NGHẼN MẠCH) ---
# Tăng số lượng kết nối tối đa lên 10 thay vì để mặc định bị bóp nghẹt
spring.datasource.hikari.maximum-pool-size=10
# Giữ tối thiểu 3 kết nối luôn ở trạng thái rảnh để phản hồi Client ngay lập tức
spring.datasource.hikari.minimum-idle=3
# Thời gian tối đa chờ đợi để lấy một kết nối từ Pool (30 giây) trước khi báo lỗi
spring.datasource.hikari.connection-timeout=30000
# Thời gian tối đa một kết nối rảnh được phép tồn tại trong Pool (10 phút)
spring.datasource.hikari.idle-timeout=600000
# Tuổi thọ tối đa của một kết nối trong Pool (30 phút)
spring.datasource.hikari.max-lifetime=1800000

# --- CẤU HÌNH ORM / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
# Hiển thị câu lệnh SQL dưới Console Server để bạn dễ dàng debug xem có hàm nào chạy lỗi không
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true